name: markdown

on:
    pull_request:
        paths:
            - '**/*.md'
            - '.markdownlint*'
    push:
        branches:
            - main
            - next
        paths:
            - '**/*.md'
            - '.markdownlint*'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    markdown:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: $/.github/actions/setup
            - run: pnpm lint:md
