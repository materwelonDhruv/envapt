name: repo-labeler

on:
    pull_request_target: # zizmor: ignore[dangerous-triggers] labeler needs a write token on fork PRs and never runs PR code
        types:
            - opened
            - synchronize
            - reopened
            - ready_for_review

permissions:
    contents: read

jobs:
    label-pull-requests:
        name: Apply PR labels
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Apply labels from config
              uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
              with:
                  configuration-path: .github/labeler.yml
                  sync-labels: true
