name: lint-actions

on:
    pull_request:
        paths:
            - '.github/workflows/**'
            - '.github/actions/**'
    push:
        branches:
            - main
            - next
        paths:
            - '.github/workflows/**'
            - '.github/actions/**'

permissions:
    contents: read

jobs:
    actionlint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            security-events: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: zizmor
              uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
            - name: actionlint
              uses: kjanat/actionlint@08bb2c4f0d039744455b87aef1c647fb8b66d37b # v1.17.0
              with:
                  format: github
                  shellcheck: true
