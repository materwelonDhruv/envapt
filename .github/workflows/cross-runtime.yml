name: cross-runtime

on:
    workflow_call:
    pull_request:
        paths-ignore:
            - '**/*.md'
            - '.vscode/**'
            - '.changeset/**'
            - '.github/ISSUE_TEMPLATE/**'
            - '.github/PULL_REQUEST_TEMPLATE.md'

concurrency:
    group: cross-runtime-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        name: Build dist artifact
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1
                  persist-credentials: false
            - name: Setup workspace
              uses: $/.github/actions/setup
            - run: pnpm --filter envapt build
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: envapt-dist-and-suites
                  compression-level: 0
                  include-hidden-files: true
                  path: |
                      packages/envapt/dist/
                      packages/envapt/tests/integration/
                  if-no-files-found: error

    test-node:
        name: node ${{ matrix.node }} / ${{ matrix.os }}
        needs: build
        runs-on: ${{ matrix.os }}
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { node: '22', os: ubuntu-latest }
                    - { node: '24', os: ubuntu-latest }
                    - { node: '26', os: ubuntu-latest }
                    - { node: '22', os: macos-latest }
                    - { node: '22', os: windows-latest }
        steps:
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ matrix.node }}
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: envapt-dist-and-suites
                  path: packages/envapt/
            - run: node packages/envapt/tests/integration/run.mjs

    test-bun:
        name: bun / ubuntu
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.4
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: envapt-dist-and-suites
                  path: packages/envapt/
            - run: bun run.mjs
              working-directory: packages/envapt/tests/integration
            - run: bun packages/envapt/tests/integration/modern-decorator-check.ts

    test-deno:
        name: deno / ubuntu
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
              with:
                  deno-version: 2.9.8
            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: envapt-dist-and-suites
                  path: packages/envapt/
            - run: deno run -A --config packages/envapt/tests/integration/deno.json packages/envapt/tests/integration/run.mjs
            - run: deno run -A --no-config packages/envapt/tests/integration/modern-decorator-check.ts

    test-workerd:
        name: workerd
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1
                  persist-credentials: false
            - name: Setup workspace
              uses: $/.github/actions/setup
            - run: pnpm --filter envapt build
            - run: pnpm --filter envapt test:workers

    test-browser:
        name: browser
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1
                  persist-credentials: false
            - name: Setup workspace
              uses: $/.github/actions/setup
            - name: Cache Playwright browsers
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
            - run: pnpm --filter envapt exec playwright install --with-deps chromium
            - run: pnpm --filter envapt build
            - run: pnpm --filter envapt test:browser

    test-consumer-build:
        name: consumer-build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 1
                  persist-credentials: false
            - name: Setup workspace
              uses: $/.github/actions/setup
            - run: pnpm --filter envapt build
            - run: pnpm --filter envapt test:consumer-build

    cross-runtime-ok:
        name: cross-runtime ok
        needs: [test-node, test-bun, test-deno, test-workerd, test-browser, test-consumer-build]
        if: always()
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Verify every runtime job succeeded
              env:
                  RESULTS: ${{ toJSON(needs) }}
              run: |
                  echo "$RESULTS"
                  failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | .key')
                  if [ -n "$failed" ]; then
                      echo "Failed jobs:"
                      echo "$failed"
                      exit 1
                  fi
                  echo "All cross-runtime jobs succeeded."
