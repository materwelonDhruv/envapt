name: checks

on:
    workflow_call:
    pull_request:
        types: [opened, reopened, synchronize, ready_for_review]
        paths-ignore:
            - '**/*.md'
            - '.vscode/**'
            - '.changeset/**'
            - '.github/ISSUE_TEMPLATE/**'
            - '.github/PULL_REQUEST_TEMPLATE.md'

concurrency:
    group: checks-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    run-checks:
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Turbo cache
              uses: ./.github/actions/turbo-cache
              with:
                  turbo_token: ${{ secrets.TURBO_TOKEN }}
                  turbo_team: ${{ vars.TURBO_TEAM }}
                  enable_fallback_cache: 'true'
            - name: Setup workspace
              uses: ./.github/actions/setup
            - name: Workspace catalog check
              run: pnpm check:catalog
            - name: Build, type-check, lint, format, and build guards
              run: >
                  pnpm exec turbo run build tc lint fmt:check build:verify
                  test:exports-dedup test:resolution-matrix test:cjs-validity test:tsc-emit test:stage3-emit
                  test:tsc-emit:ts7 test:stage3-emit:ts7 test:tree-shaking
            - name: Test
              run: pnpm exec turbo run test
            - name: Run audit
              run: pnpm audit --audit-level=high
