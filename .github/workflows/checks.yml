name: checks

on:
    workflow_call:
        secrets:
            TURBO_TOKEN:
                required: false
    pull_request:
        paths-ignore:
            - '**/*.md'
            - '.vscode/**'
            - '.changeset/**'
            - '.github/ISSUE_TEMPLATE/**'
            - '.github/PULL_REQUEST_TEMPLATE.md'

concurrency:
    group: checks-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    run-checks:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        env:
            TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Turbo cache
              uses: $/.github/actions/turbo-cache
            - name: Setup workspace
              uses: $/.github/actions/setup
            - name: Workspace catalog check
              run: pnpm check:catalog
            - name: Markdown lint
              run: pnpm lint:md
            - name: Build, type-check, lint, format, and build guards
              run: >
                  pnpm exec turbo run build tc lint fmt:check build:verify test:exports-dedup test:resolution-matrix test:tsc-emit test:stage3-emit test:babel-emit test:tsc-emit:ts7 test:stage3-emit:ts7 test:tree-shaking
            - name: Root scripts type-check, lint, and test
              run: pnpm tc:root && pnpm lint:root && pnpm test:scripts
            - name: Test
              run: pnpm exec turbo run test
