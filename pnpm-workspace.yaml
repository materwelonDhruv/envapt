packages:
  - packages/*
  - apps/*

embedReadme: true

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  sharp: false
  unrs-resolver: true
  workerd: true

catalogs:
  dev:
    '@cloudflare/workers-types': ^5.20260911.1
    '@seedcord/eslint-config': 2.2.1
    '@types/node': 26.5.1
    prettier: 3.9.6
    eslint: 10.10.0
    typescript: 6.0.3
    zod: 4.6.4
    vitest: 4.1.11

overrides:
  brace-expansion@<1.1.20: ^1.1.20
  brace-expansion@>=2.0.0 <2.1.6: ^2.1.6
  brace-expansion@>=5.0.0 <5.0.11: ^5.0.11
  sharp@<0.35.5: ^0.35.5
  smol-toml@<1.7.1: ^1.7.1
  source-map-js@<1.2.2: ^1.2.2
  undici@>=7.0.0 <7.29.1: ^7.29.1
