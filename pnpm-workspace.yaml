packages:
  - packages/*
  - apps/*

embedReadme: true

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  sharp: false
  unrs-resolver: true
  workerd: true

catalogs:
  dev:
    '@cloudflare/workers-types': ^5.20260730.1
    '@seedcord/eslint-config': 1.4.3
    '@types/node': 25.9.3
    prettier: 3.8.4
    eslint: 9.39.2
    typescript: 6.0.3
    zod: 4.4.3
    vitest: 4.1.10

overrides:
  brace-expansion@>=4.0.0 <5.0.8: ^5.0.8
  fast-uri@>=3.0.0 <=3.1.3: ^3.1.4
  js-yaml@>=5.0.0 <=5.2.1: ^5.2.2
  next@>=16.0.0 <16.2.11: ^16.2.11
  postcss@<=8.5.17: ^8.5.18
  sharp@<0.35.0: ^0.35.0
  valibot@<=1.4.1: ^1.4.2
